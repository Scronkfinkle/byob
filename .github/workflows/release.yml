# Push a tag like v0.2.0 (matching Cargo.toml's version) to build binaries for every platform
# and publish a GitHub release with them. Two archives per platform: `byob-…` with the browser
# UI compiled in (`byob --serve` just works) and the HTML app renderer (byob-artifact-host, the
# Servo helper, next to byob, with its MPL NOTICE), and `byob-slim-…` with neither.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"; exit 1
          fi

  web:
    name: Browser UI
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix develop --command cargo xtask web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: apps/byob-web/dist

  # The Servo helper (host/artifact-host, its own workspace; AGENTS.md §3). SpiderMonkey comes
  # prebuilt (mozjs_sys downloads the archive for the target).
  helper:
    name: HTML app renderer ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config python3 libfontconfig1-dev libfreetype-dev libegl1-mesa-dev libgl1-mesa-dev zlib1g-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: host/artifact-host
          key: helper-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --manifest-path host/artifact-host/Cargo.toml --target ${{ matrix.target }}
      # Windows draws through ANGLE (Cargo.toml): its two DLLs go next to the helper, with
      # ANGLE's licence from the exact source that was built.
      - name: Gather the helper's files
        shell: bash
        run: |
          set -euo pipefail
          rel=host/artifact-host/target/${{ matrix.target }}/release
          mkdir -p helper-out
          cp "$rel"/byob-artifact-host* helper-out/ 2>/dev/null || true
          rm -f helper-out/*.d helper-out/*.pdb
          if [[ "$RUNNER_OS" == Windows ]]; then
            egl=$(find "$rel/build" -path '*mozangle-*/out/libEGL.dll' | head -1)
            cp "$egl" "$(dirname "$egl")/libGLESv2.dll" helper-out/
            cp "$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -path '*mozangle-*/gfx/angle/checkout/LICENSE' | head -1)" helper-out/LICENSE-ANGLE
          fi
          ls -la helper-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helper-${{ matrix.target }}
          path: helper-out/
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: [version, web, helper]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, smoke: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, smoke: true }
          - { target: aarch64-apple-darwin, os: macos-latest, smoke: true }
          # Cross-built on an Apple silicon runner, so its helper can't be run here.
          - { target: x86_64-apple-darwin, os: macos-latest, smoke: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, smoke: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      # byob-web-assets compiles whatever is in crates/web-assets/assets/ into the full build.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: crates/web-assets/assets
      - name: Build (full, with the browser UI)
        run: cargo build --release --locked -p byob --target ${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helper-${{ matrix.target }}
          path: helper
      # The helper really renders on this OS: byob's own tests that drive a real helper (load a
      # page, input, frames, the bridge) run against the one just built.
      - name: Smoke test the HTML app renderer
        if: matrix.smoke
        shell: bash
        env:
          RUST_BACKTRACE: "1"
          RUST_LOG: info
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then sudo apt-get install -y libegl1 libgl1-mesa-dri; fi
          chmod +x helper/byob-artifact-host* || true
          exe=helper/byob-artifact-host; [[ "$RUNNER_OS" == Windows ]] && exe=helper/byob-artifact-host.exe
          # Without a helper these tests skip, so make sure there is one.
          [[ -f "$exe" ]] || { echo "::error::no helper at $exe"; exit 1; }
          BYOB_ARTIFACT_HOST="$PWD/$exe" cargo test --release --locked -p byob --target ${{ matrix.target }} -- apphost::tests::clicking_a_canvas_does_not_highlight_it apphost::tests::the_bridge_carries_messages_both_ways --exact
      - name: Build (slim)
        run: cargo build --release --locked -p byob --no-default-features --target ${{ matrix.target }} --target-dir target/slim
      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          exe=byob; [[ "$RUNNER_OS" == Windows ]] && exe=byob.exe
          pack() { # pack <archive name> <built binary> [with the helper]
            local name=$1 bin=$2 helper=${3:-} archive
            mkdir -p "$name"
            cp "$bin" "$name/"
            cp LICENSE-MIT LICENSE-APACHE README.md "$name/"
            if [[ -n "$helper" ]]; then
              # byob finds it next to itself. It links Servo/SpiderMonkey (MPL-2.0): NOTICE says
              # where their source is.
              cp helper/* "$name/"
              chmod +x "$name"/byob-artifact-host* || true
              cp host/artifact-host/NOTICE "$name/NOTICE-byob-artifact-host"
            fi
            if [[ "$RUNNER_OS" == Windows ]]; then
              7z a "$name.zip" "$name" > /dev/null; archive="$name.zip"
            else
              tar czf "$name.tar.gz" "$name"; archive="$name.tar.gz"
            fi
            echo "$archive"
          }
          full=$(pack "byob-$VERSION-$TARGET" "target/$TARGET/release/$exe" helper)
          slim=$(pack "byob-slim-$VERSION-$TARGET" "target/slim/$TARGET/release/$exe")
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "slim=$slim" >> "$GITHUB_OUTPUT"
      # Each archive is its own artifact, as is (not zipped again): a download is the archive.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.full }}
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.slim }}
          archive: false
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: byob-*
          merge-multiple: true
          # The archives as uploaded; a .zip would otherwise be unpacked into a folder.
          skip-decompress: true
      - name: Checksums
        run: for f in byob-*.tar.gz byob-*.zip; do sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            byob-*.tar.gz
            byob-*.zip
            byob-*.sha256
          generate_release_notes: true
