# The full local gate (`cargo xtask ci`: fmt, clippy, tests, layers, wasm) in the Nix dev
# shell on Linux, plus build + test on macOS and Windows, which nothing else exercises.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate (Linux, Nix)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # TEMPORARY (PR #1): why does a sandboxed fork fail with ENOMEM on this runner?
      - name: Sandbox diagnostics
        continue-on-error: true
        run: |
          uname -a
          for f in /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/kernel/unprivileged_userns_clone /proc/sys/user/max_user_namespaces /proc/sys/user/max_pid_namespaces /proc/sys/vm/overcommit_memory; do echo "$f = $(cat "$f" 2>/dev/null || echo n/a)"; done
          ulimit -a
          nix develop --command cargo nextest run -p byob-exec -p byob-sandbox --no-fail-fast -j 1 || true
      - name: cargo xtask ci
        run: nix develop --command cargo xtask ci
      - name: Crates package cleanly
        run: nix develop --command cargo package --workspace --exclude byob-web --exclude xtask --no-verify --locked

  platforms:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
