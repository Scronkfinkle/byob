[package]
name = "byob-server"
description = "Serves the web UI and bridges WebSocket clients to the engine. Thread-per-connection, no async runtime (L4)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Serve the browser UI compiled into the binary (byob-web-assets) when no --web-dir is set.
embedded-web = ["dep:byob-web-assets", "dep:flate2"]

[dependencies]
byob-web-assets = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
byob-agent.workspace = true
byob-protocol.workspace = true
tungstenite.workspace = true
httparse.workspace = true
log.workspace = true

[dev-dependencies]
byob-types.workspace = true
byob-store.workspace = true
byob-tools.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
