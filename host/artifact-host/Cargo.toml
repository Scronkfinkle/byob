# byob-artifact-host: renders one HTML app artifact with Servo, offscreen, for the byob
# desktop app, which talks to it over stdin/stdout (crates/artifact-wire).
#
# A separate workspace ON PURPOSE (see AGENTS.md "Exemption: the artifact host"): Servo is
# MPL-2.0 and pulls in tokio, which byob's own workspace bans. Keeping it here means none of
# that enters byob's dependency graph, lock file or feature unification; byob only ever spawns
# this binary as a child process.
[workspace]
resolver = "3"

[package]
name = "byob-artifact-host"
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
publish = false

[dependencies]
byob-artifact-wire = { path = "../../crates/artifact-wire" }
# No multiprocess/devtools/clipboard/gamepad; `bundled` = baked-in resources + freetype.
servo = { version = "0.8.0", default-features = false, features = ["bundled", "js_jit"] }
euclid = "0.22"
url = "2.5"
dpi = "0.1"
# Servo's network stack wants a process-wide crypto provider even though every load is
# refused (see main.rs).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
debug = false
strip = true
