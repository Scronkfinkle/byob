[package]
name = "byob-artifact-wire"
description = "Wire protocol between byob and the byob-artifact-host helper process (L1, no dependencies)"
# No workspace-inherited fields: the separate host/artifact-host workspace path-depends on
# this crate, so it must stand on its own.
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Scronkfinkle/byob"

[dependencies]

# Same as the workspace's lints, spelled out (see above).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"
