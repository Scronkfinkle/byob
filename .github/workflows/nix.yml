# Builds the flake's packages when anything they depend on changes. `cargo xtask ci` doesn't
# run `nix build`, which is how a missing system library once slipped through.
name: Nix

on:
  push:
    branches: [main]
    paths: ["flake.nix", "flake.lock", "Cargo.lock", "**/Cargo.toml", "host/**", ".github/workflows/nix.yml"]
  pull_request:
    paths: ["flake.nix", "flake.lock", "Cargo.lock", "**/Cargo.toml", "host/**", ".github/workflows/nix.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: nix build .#${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package: [byob, byob-artifact-host]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix build .#${{ matrix.package }} --print-build-logs
