[package]
name = "byob-web-assets"
description = "byob's browser UI (the wasm build of byob-web), embedded so `byob --serve` works without extra files"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# `assets/` is generated by `cargo xtask web` and gitignored; list it explicitly so the
# published crate carries the built UI.
include = ["Cargo.toml", "build.rs", "src/**", "assets/*.gz", "assets/index.html"]

[dependencies]

[lints]
workspace = true
