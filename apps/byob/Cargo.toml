[package]
name = "byob"
description = "byob (bring your own brain): a native desktop AI coworker for any OpenAI-compatible endpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[features]
# The browser UI (`byob --serve`), compiled in. `--no-default-features` builds the slim
# desktop-only binary.
default = ["web"]
web = ["byob-server/embedded-web"]

[dependencies]
byob-types.workspace = true
byob-agent.workspace = true
byob-tools.workspace = true
byob-plugins.workspace = true
byob-sandbox.workspace = true
byob-exec.workspace = true
byob-store.workspace = true
byob-server.workspace = true
byob-ui-egui.workspace = true
egui.workspace = true
eframe = { workspace = true, features = ["persistence"] }
log.workspace = true
env_logger.workspace = true
png.workspace = true
# Talking to the Servo helper process (host/artifact-host) that renders HTML apps inline.
byob-artifact-wire.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
