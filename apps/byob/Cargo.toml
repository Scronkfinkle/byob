[package]
name = "byob"
description = "byob (bring your own brain): a native desktop AI coworker for any OpenAI-compatible endpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[features]
# The browser UI (`byob --serve`), compiled in. `--no-default-features` builds the slim
# desktop-only binary.
default = ["web", "native-sheets", "native-web-tools", "native-mail"]
web = ["byob-server/embedded-web"]
# The spreadsheets backend (byob-sheets, IronCalc in-process) behind the bundled `sheets`
# plugin. Without it that plugin reports its backend missing.
native-sheets = ["dep:byob-sheets"]
# web_search and web_fetch (byob-web-tools, in-process) behind the bundled `web` plugin.
native-web-tools = ["dep:byob-web-tools"]
# Email over IMAP/SMTP (byob-mail, in-process) behind the bundled `mail` plugin.
native-mail = ["dep:byob-mail"]

[dependencies]
byob-types.workspace = true
byob-agent.workspace = true
byob-tools.workspace = true
byob-plugins.workspace = true
byob-sandbox.workspace = true
byob-exec.workspace = true
byob-sheets = { workspace = true, optional = true }
byob-web-tools = { workspace = true, optional = true }
byob-memory.workspace = true
byob-help.workspace = true
byob-calendar.workspace = true
byob-mail = { workspace = true, optional = true }
# Telegram as a channel (My phone) behind the bundled `telegram` plugin.
byob-telegram.workspace = true
byob-ntfy.workspace = true
byob-store.workspace = true
byob-server.workspace = true
byob-ui-egui.workspace = true
# Token counts in the window (o200k; the browser build estimates instead).
tiktoken-rs.workspace = true
egui.workspace = true
eframe = { workspace = true, features = ["persistence"] }
log.workspace = true
env_logger.workspace = true
# --look: appearance changes as the model's ui_look sends them.
byob-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
png.workspace = true
# Talking to the Servo helper process (host/artifact-host) that renders HTML apps inline.
byob-artifact-wire.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

# The tray icon and notifications (background/): D-Bus on Linux and the BSDs, the system's
# own APIs on macOS and Windows.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ksni.workspace = true
zbus.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon.workspace = true
notify-rust.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
