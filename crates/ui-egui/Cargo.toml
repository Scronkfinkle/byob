[package]
name = "yah-ui-egui"
description = "egui frontend. Talks to the engine only via yah-protocol; must compile to wasm32 (L4)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
yah-protocol.workspace = true
egui.workspace = true
ewebsock.workspace = true
log.workspace = true
web-time.workspace = true
serde.workspace = true
pulldown-cmark.workspace = true
yah-types.workspace = true
image.workspace = true

# Browser-only: the file picker and reading dropped files (async browser APIs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["File", "FileList", "Blob", "BlobPropertyBag", "Url", "Element", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "HtmlIFrameElement", "MessageEvent", "Node"] }

[dev-dependencies]
tungstenite.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true
pollster.workspace = true
