[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/jesse/yah"

[workspace.dependencies]
# Internal crates (see docs/architecture.md for layering).
yah-types = { path = "crates/types" }
yah-protocol = { path = "crates/protocol" }
yah-server = { path = "crates/server" }
yah-llm = { path = "crates/llm" }
yah-store = { path = "crates/store" }
yah-tools = { path = "crates/tools" }
yah-mcp = { path = "crates/mcp" }
yah-plugins = { path = "crates/plugins" }
yah-sandbox = { path = "crates/sandbox" }
yah-exec = { path = "crates/exec" }
yah-agent = { path = "crates/agent" }
yah-ui-egui = { path = "crates/ui-egui" }

# Foundation.
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
url = { version = "2", features = ["serde"] }
directories = "6"

# Inference client: blocking HTTP so the engine stays runtime-free (no tokio
# in UI/engine, matching filmcraft). rustls avoids an OpenSSL system dep.
ureq = { version = "3", features = ["json"] }

# Remote UI transport. Deliberately runtime-free (no tokio): a personal harness
# serves a handful of clients, so thread-per-connection is plenty.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
httparse = "1"
ewebsock = "0.8"
# wasm-safe `Instant` (std::time::Instant panics on wasm32-unknown-unknown).
web-time = "1"

# Web frontend (wasm32 only).
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "HtmlCanvasElement"] }

# Persistence. `bundled` compiles SQLite in, so no system lib is needed.
rusqlite = { version = "0.41", features = ["bundled"] }

# UI.
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "clipboard", "wayland", "x11"] }
rfd = "0.18"
# Markdown for assistant messages. No default features: skips the HTML renderer and getopts.
pulldown-cmark = { version = "0.13", default-features = false }

# Charts, images and uploads. `image` decodes PNG/JPEG only (also in the browser);
# base64 carries upload chunks and images inside the JSON protocol.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

# Headless test screenshots (`yah --screenshot`).
png = "0.18"

# Sandbox (yah-sandbox). Safe Landlock bindings; `nix` for unshare/killpg/setrlimit
# (rustix's `unshare` is `unsafe`, and the workspace forbids unsafe code).
landlock = "0.4"
nix = { version = "0.31", default-features = false, features = ["sched", "signal", "resource", "user", "process"] }

# Testing.
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
