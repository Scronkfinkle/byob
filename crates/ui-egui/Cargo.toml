[package]
name = "byob-ui-egui"
description = "egui frontend. Talks to the engine only via byob-protocol; must compile to wasm32 (L4)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
byob-protocol.workspace = true
egui.workspace = true
# Only for its `color_fonts` feature (color emoji); egui re-exports the API.
epaint.workspace = true
# Backdrop shaders (`cockpit`): wgpu paint callbacks, and naga to check a shader first.
egui-wgpu.workspace = true
naga.workspace = true
ewebsock.workspace = true
log.workspace = true
web-time.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
ratex-parser.workspace = true
ratex-layout.workspace = true
ratex-types.workspace = true
ratex-katex-fonts.workspace = true
lyon_tessellation.workspace = true
byob-types.workspace = true
image.workspace = true
egui-pop-phosphor = { version = "0.15.0", features = ["regular", "fill"] }

# Browser-only: the file picker and reading dropped files (async browser APIs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["ClipboardEvent", "DataTransfer", "EventTarget", "Event", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "Element", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "HtmlIFrameElement", "MessageEvent", "Node", "Window"] }

[dev-dependencies]
tungstenite.workspace = true
ron.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true
pollster.workspace = true
directories.workspace = true
