[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]
# The Servo helper is its own workspace (MPL-2.0 + tokio inside it; never linked into byob).
exclude = ["host/artifact-host"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Scronkfinkle/byob"
homepage = "https://github.com/Scronkfinkle/byob"
keywords = ["ai", "llm", "agent", "desktop", "egui"]
categories = ["gui", "development-tools"]

[workspace.dependencies]
# Internal crates (see docs/architecture.md for layering).
byob-types = { path = "crates/types", version = "0.2.1" }
byob-web-assets = { path = "crates/web-assets", version = "0.2.1" }
byob-bundled = { path = "crates/bundled", version = "0.2.1" }
byob-protocol = { path = "crates/protocol", version = "0.2.1" }
byob-server = { path = "crates/server", version = "0.2.1" }
byob-llm = { path = "crates/llm", version = "0.2.1" }
byob-store = { path = "crates/store", version = "0.2.1" }
byob-tools = { path = "crates/tools", version = "0.2.1" }
byob-mcp = { path = "crates/mcp", version = "0.2.1" }
byob-plugins = { path = "crates/plugins", version = "0.2.1" }
byob-sandbox = { path = "crates/sandbox", version = "0.2.1" }
byob-exec = { path = "crates/exec", version = "0.2.1" }
byob-agent = { path = "crates/agent", version = "0.2.1" }
byob-ui-egui = { path = "crates/ui-egui", version = "0.2.1" }
byob-artifact-wire = { path = "crates/artifact-wire", version = "0.2.1" }
byob-sheets = { path = "crates/sheets", version = "0.2.1" }

# Spreadsheets (byob-sheets): pinned to the version the bundled Python plugin installs
# (`ironcalc==0.9.1`), so the two implementations compute the same. MIT OR Apache-2.0.
ironcalc = "=0.9.1"

# Foundation.
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
url = { version = "2", features = ["serde"] }
directories = "6"

# Inference client: blocking HTTP so the engine stays runtime-free (no tokio
# in UI/engine, matching filmcraft). rustls avoids an OpenSSL system dep.
ureq = { version = "3", features = ["json"] }

# Remote UI transport. Deliberately runtime-free (no tokio): a personal harness
# serves a handful of clients, so thread-per-connection is plenty.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
httparse = "1"
# Decompressing the embedded (gzipped) web UI for the rare client without gzip support.
flate2 = "1"
ewebsock = "0.8"
# wasm-safe `Instant` (std::time::Instant panics on wasm32-unknown-unknown).
web-time = "1"

# Web frontend (wasm32 only).
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "HtmlCanvasElement"] }

# Persistence. `bundled` compiles SQLite in, so no system lib is needed.
rusqlite = { version = "0.41", features = ["bundled"] }

# UI.
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "clipboard", "wayland", "x11"] }
# File dialogs (desktop). GTK3 backend on Linux: works without a desktop portal service.
# Linux: XDG desktop portal over D-Bus (pure Rust, zenity fallback), so the binary links no
# GUI toolkit and `--headless` runs on bare servers. (rfd takes exactly one backend, so no GTK opt-in.)
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
pollster = "1"
# The format eframe persists app state in (tests check preference migration with it).
ron = "0.12"
# Markdown for assistant messages. No default features: skips the HTML renderer and getopts.
pulldown-cmark = { version = "0.13", default-features = false }

# Charts, images and uploads. `image` decodes PNG/JPEG only (also in the browser);
# base64 carries upload chunks and images inside the JSON protocol.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

# Headless test screenshots (`byob --screenshot`).
png = "0.18"

# Sandbox (byob-sandbox). Safe Landlock bindings; `nix` for unshare/killpg/setrlimit
# (rustix's `unshare` is `unsafe`, and the workspace forbids unsafe code).
landlock = "0.4"
nix = { version = "0.31", default-features = false, features = ["sched", "signal", "resource", "user", "process"] }

# Testing.
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
